<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 72" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="10" y1="8" x2="110" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3C4"/>
      <stop offset=".35" stop-color="#E8C547"/>
