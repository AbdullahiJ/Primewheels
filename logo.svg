  <!-- wheels -->
  <circle cx="34" cy="52.5" r="6.2" fill="#111" stroke="url(#gold)" stroke-width="1.8"/>
  <circle cx="34" cy="52.5" r="2.4" fill="url(#chrome)"/>
  <circle cx="86" cy="52.5" r="6.2" fill="#111" stroke="url(#gold)" stroke-width="1.8"/>
