  <path fill="#000" opacity=".28" d="M468 132c18 10 30 24 36 40h48c-6-18-20-32-40-40l-44 0Z"/>
  <circle cx="320" cy="228" r="28" fill="#111" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="320" cy="228" r="10" fill="url(#chrome)"/>
  <circle cx="650" cy="228" r="28" fill="#111" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="650" cy="228" r="10" fill="url(#chrome)"/>

  <!-- wordmark -->
  <text x="500" y="310" text-anchor="middle" font-family="Montserrat, Arial Black, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="4">
