<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="PRIME WHEELS AFRICA">
  <defs>
    <linearGradient id="gold" x1="80" y1="40" x2="920" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF3C4"/>
      <stop offset=".3" stop-color="#E8C547"/>
      <stop offset=".65" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#8A6A10"/>
    </linearGradient>
    <linearGradient id="chrome" x1="200" y1="60" x2="860" y2="220" gradientUnits="userSpaceOnUse">
