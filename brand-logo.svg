  <text x="500" y="348" text-anchor="middle" fill="url(#gold)" font-family="Montserrat, Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="8">AFRICA</text>
  <line x1="320" y1="368" x2="420" y2="368" stroke="url(#gold)" stroke-width="2"/>
  <line x1="580" y1="368" x2="680" y2="368" stroke="url(#gold)" stroke-width="2"/>
  <text x="500" y="392" text-anchor="middle" fill="#E8D59A" font-family="Montserrat, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="4">CAR HIRE " SALES " LEASING</text>
