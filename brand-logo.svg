  <rect width="1000" height="420" fill="#050505"/>

  <!-- swooshes -->
  <path d="M210 145c95-78 235-105 390-78" stroke="url(#chrome)" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M230 168c105-70 250-90 385-58" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M620 95c55 12 95 40 118 78" stroke="url(#chrome)" stroke-width="7" stroke-linecap="round" fill="none" opacity=".85"/>

  <!-- car -->
  <path fill="url(#gold)" d="M250 210c8-22 28-42 58-52l42-16c14-30 44-50 86-52 36-2 68 12 90 38l48 14c30 8 50 28 56 52l2 14H248l2-10Z"/>
