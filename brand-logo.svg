    </linearGradient>
    <linearGradient id="primeGold" x1="80" y1="220" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A0"/>
      <stop offset=".5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#A88920"/>
    </linearGradient>
